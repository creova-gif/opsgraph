[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opsgraph"
version = "0.2.0"
description = "Turns a startup's existing Google Workspace into an AI-maintained company operating system."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }

[project.optional-dependencies]
drive = [
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.2.0",
    "google-auth>=2.30.0",
]

[project.scripts]
opsgraph = "opsgraph_cli:main"

[tool.setuptools]
py-modules = ["opsgraph_cli"]
packages = [
    "certificate", "compiler", "dashboard", "demo", "gap_engine",
    "guardian", "integrations", "inventory", "plan", "qa", "resolver",
    "rules", "schema", "store",
]

[tool.setuptools.package-data]
rules = ["*.json"]
schema = ["*.json"]

# NOTE: examples/ and docs/design/ assets are repo-only. Wheel installs ship
# rules + schema as package data; _load_tokens falls back to baked CALIBRATION
# values when tokens.json isn't on disk.
