# Core required-state rules, v0.2 Operating Graph Node Schema.
# Conforms to Section 16 of the OpsGraph Strategy Brief.
# Each artifact is a governed node in the Operating Graph.
# requirement levels: required | recommended | optional | not_applicable
# Never encode a legal or certification claim here; these are operational best practice.
# Facts the system cannot know stay as placeholders for founder input (never invented).

version: "0.2"
taxonomy_roots:
  "00": Company Control
  "01": Governance & Leadership
  "02": Finance & Corporate
  "03": People
  "04": Product
  "05": Engineering & Security
  "06": Sales & Customers
  "07": Marketing & Brand
  "08": Operations
  "09": Legal / Privacy / Compliance
  "10": Data & AI
  "99": Archive

artifacts:
  # --- 00 Company Control ---
  - id: CO-001
    name: Master Document Register
    root: "00"
    type: register
    criticality: high
    owner_role: COO_or_founder
    review_cadence_days: 30
    depends_on: [CO-002, CO-003]
    evidence_types: [approved_register_entry]
    framework_mappings: [ISO9001-7.5, SOC2-CC5.2]
    requirement:
      default: required
    why: Single source of truth for identifiers, owners, status and versions; prevents duplicates.

  - id: CO-002
    name: Document Control Procedure
    root: "00"
    type: procedure
    criticality: high
    owner_role: COO_or_founder
    review_cadence_days: 365
    depends_on: [CO-003]
    evidence_types: [signed_policy, version_history]
    framework_mappings: [ISO9001-7.5.3, SOC2-CC5.3]
    requirement:
      default: required
    why: Defines numbering, lifecycle, approval and archive rules.

  - id: CO-003
    name: Company Profile
    root: "00"
    type: record
    criticality: high
    owner_role: founder
    review_cadence_days: 90
    depends_on: []
    evidence_types: [onboarding_signoff, cap_table_extract]
    framework_mappings: [Delaware-Corp-General]
    requirement:
      default: required
    why: Captured onboarding facts that drive all other requirements.

  - id: CO-004
    name: Ownership / RACI Matrix
    root: "00"
    type: matrix
    criticality: high
    owner_role: COO_or_founder
    review_cadence_days: 90
    depends_on: [CO-003]
    evidence_types: [role_charter, board_approval]
    framework_mappings: [SOC2-CC1.3]
    requirement:
      default: required
    why: Every artifact needs an owner and an approver.

  - id: CO-005
    name: Policy Register
    root: "00"
    type: register
    criticality: high
    owner_role: COO_or_founder
    review_cadence_days: 90
    depends_on: [CO-001, CO-002]
    evidence_types: [annual_review_signoff]
    framework_mappings: [SOC2-CC5.2, ISO27001-A.5.1]
    requirement:
      default: required
    why: Tracks policy status, owner, review date and evidence links.

  # --- 01 Governance ---
  - id: GV-001
    name: Decision Record Log
    root: "01"
    type: log
    criticality: medium
    owner_role: founder
    review_cadence_days: 30
    depends_on: [CO-001]
    evidence_types: [dated_adr_approval]
    framework_mappings: [SOC2-CC1.4]
    requirement:
      default: required
    why: Preserves context and rationale for leadership handoff and diligence.

  - id: GV-002
    name: Risk Register
    root: "01"
    type: register
    criticality: high
    owner_role: founder
    review_cadence_days: 90
    depends_on: [CO-001]
    evidence_types: [quarterly_risk_review]
    framework_mappings: [SOC2-CC3.1, ISO27001-A.6.1]
    requirement:
      default: required
      overrides:
        - when: {stage_gte: seed}
          level: required
        - when: {stage_in: [idea]}
          level: recommended
    why: Maps risks to owners and mitigations.

  - id: GV-003
    name: Weekly Leadership Agenda
    root: "01"
    type: template
    criticality: medium
    owner_role: founder
    review_cadence_days: 7
    depends_on: [CO-004]
    evidence_types: [meeting_notes]
    framework_mappings: [SOC2-CC1.2]
    requirement:
      default: recommended
      overrides:
        - when: {employees_gte: 8}
          level: required
    why: Repeatable cadence once tacit founder knowledge stops scaling.

  - id: GV-004
    name: Monthly Operating Review
    root: "01"
    type: template
    criticality: medium
    owner_role: COO_or_founder
    review_cadence_days: 30
    depends_on: [GV-003]
    evidence_types: [operating_deck_minutes]
    framework_mappings: [SOC2-CC2.1]
    requirement:
      default: recommended
      overrides:
        - when: {employees_gte: 20}
          level: required
    why: Operating metrics and exception review.

  - id: GV-005
    name: Annual Objectives
    root: "01"
    type: record
    criticality: medium
    owner_role: founder
    review_cadence_days: 365
    depends_on: [CO-003]
    evidence_types: [board_presentation]
    framework_mappings: [SOC2-CC1.1]
    requirement:
      default: recommended
    why: Anchor for priorities and board reporting.

  # --- 02 Finance & Corporate ---
  - id: FN-001
    name: Vendor Register
    root: "02"
    type: register
    criticality: high
    owner_role: finance_or_founder
    review_cadence_days: 90
    depends_on: [CO-001]
    evidence_types: [executed_msa_dpa, security_review]
    framework_mappings: [SOC2-CC9.2, ISO27001-A.15]
    requirement:
      default: required
    why: Needed for procurement hygiene and enterprise security questionnaires.

  - id: FN-002
    name: Approval Matrix
    root: "02"
    type: matrix
    criticality: high
    owner_role: finance_or_founder
    review_cadence_days: 180
    depends_on: [CO-004]
    evidence_types: [board_signing_policy]
    framework_mappings: [SOC2-CC2.2]
    requirement:
      default: recommended
      overrides:
        - when: {employees_gte: 15}
          level: required
    why: Delegated spend and signing authority.

  - id: FN-003
    name: Investor Update Template
    root: "02"
    type: template
    criticality: medium
    owner_role: founder
    review_cadence_days: 30
    depends_on: [CO-003]
    evidence_types: [investor_distribution_record]
    framework_mappings: [Delaware-Corp-Reporting]
    requirement:
      default: recommended
      overrides:
        - when: {triggers_any: [fundraise_data_room]}
          level: required
    why: Consistent investor reporting.

  - id: FN-004
    name: Data Room Index
    root: "02"
    type: index
    criticality: high
    owner_role: founder
    review_cadence_days: 30
    depends_on: [CO-001, FN-001]
    evidence_types: [verified_file_checksum]
    framework_mappings: [DueDiligence-Standard]
    requirement:
      default: optional
      overrides:
        - when: {triggers_any: [fundraise_data_room]}
          level: required
    why: Avoids assembling diligence materials from scratch at raise time.

  - id: FN-005
    name: Procurement Checklist
    root: "02"
    type: checklist
    criticality: low
    owner_role: finance_or_founder
    review_cadence_days: 180
    depends_on: [FN-001, FN-002]
    evidence_types: [completed_procurement_form]
    framework_mappings: [SOC2-CC9.2]
    requirement:
      default: recommended
    why: Repeatable vendor onboarding.

  # --- 03 People ---
  - id: PE-001
    name: Hiring Checklist
    root: "03"
    type: checklist
    criticality: medium
    owner_role: people_lead_or_founder
    review_cadence_days: 90
    depends_on: [CO-004]
    evidence_types: [background_check, signed_offer]
    framework_mappings: [SOC2-CC1.4]
    requirement:
      default: required
      overrides:
        - when: {triggers_any: [rapid_hiring]}
          level: required
    why: Consistency during hiring surges.

  - id: PE-002
    name: Onboarding Checklist
    root: "03"
    type: checklist
    criticality: high
    owner_role: people_lead_or_founder
    review_cadence_days: 90
    depends_on: [PE-001]
    evidence_types: [signed_ip_assignment, access_ticket]
    framework_mappings: [SOC2-CC1.4, ISO27001-A.7.1]
    requirement:
      default: required
    why: Consistent new-hire artifacts and access provisioning.

  - id: PE-003
    name: Offboarding Checklist
    root: "03"
    type: checklist
    criticality: high
    owner_role: people_lead_or_founder
    review_cadence_days: 90
    depends_on: [CO-004]
    evidence_types: [access_revocation_log, device_wipe_receipt]
    framework_mappings: [SOC2-CC6.2, ISO27001-A.7.3]
    requirement:
      default: required
    why: Access removal and record retention; audit-relevant.

  - id: PE-004
    name: Role Charter Template
    root: "03"
    type: template
    criticality: low
    owner_role: people_lead_or_founder
    review_cadence_days: 180
    depends_on: [CO-004]
    evidence_types: [signed_job_spec]
    framework_mappings: [SOC2-CC1.3]
    requirement:
      default: recommended
    why: Clear ownership as the team grows.

  - id: PE-005
    name: Training Register
    root: "03"
    type: register
    criticality: high
    owner_role: people_lead_or_founder
    review_cadence_days: 180
    depends_on: [CO-001]
    evidence_types: [completion_certificates, attendance_logs]
    framework_mappings: [SOC2-CC2.2, ISO27001-A.7.2]
    requirement:
      default: optional
      overrides:
        - when: {triggers_any: [soc2_iso, audit]}
          level: required
    why: Evidence of security and policy training.

  # --- 05 Engineering & Security ---
  - id: ES-001
    name: Access Register
    root: "05"
    type: register
    criticality: high
    owner_role: cto_or_security_lead
    review_cadence_days: 90
    depends_on: [CO-001, PE-002]
    evidence_types: [quarterly_access_review, idp_user_list]
    framework_mappings: [SOC2-CC6.1, ISO27001-A.9.2]
    requirement:
      default: recommended
      overrides:
        - when: {triggers_any: [security_questionnaires, soc2_iso, enterprise_sales]}
          level: required
    why: Who has access to what; first thing enterprise reviews ask for.

  - id: ES-002
    name: Incident Record Template
    root: "05"
    type: template
    criticality: high
    owner_role: cto_or_security_lead
    review_cadence_days: 90
    depends_on: [CO-001]
    evidence_types: [post_mortem_report, root_cause_analysis]
    framework_mappings: [SOC2-CC7.3, ISO27001-A.16.1]
    requirement:
      default: recommended
      overrides:
        - when: {triggers_any: [security_questionnaires, soc2_iso, enterprise_sales]}
          level: required
    why: Consistent incident capture and follow-up.

  - id: ES-003
    name: Change Record Template
    root: "05"
    type: template
    criticality: medium
    owner_role: cto_or_security_lead
    review_cadence_days: 180
    depends_on: [CO-001]
    evidence_types: [pr_peer_review, ci_cd_run]
    framework_mappings: [SOC2-CC8.1, ISO27001-A.12.1]
    requirement:
      default: recommended
    why: Traceability of production changes.

  - id: ES-004
    name: Architecture Decision Record Template
    root: "05"
    type: template
    criticality: medium
    owner_role: cto_or_security_lead
    review_cadence_days: 180
    depends_on: [GV-001]
    evidence_types: [git_committed_adr]
    framework_mappings: [SOC2-CC5.1]
    requirement:
      default: recommended
    why: Technical decision memory.

  - id: ES-005
    name: Security Review Calendar
    root: "05"
    type: calendar
    criticality: high
    owner_role: cto_or_security_lead
    review_cadence_days: 90
    depends_on: [CO-005]
    evidence_types: [calendar_invite, completed_audit_signoff]
    framework_mappings: [SOC2-CC4.1, ISO27001-A.18.2]
    requirement:
      default: optional
      overrides:
        - when: {triggers_any: [soc2_iso, enterprise_sales]}
          level: required
    why: Scheduled reviews that become evidence later.

  # --- 06 Sales & Customers ---
  - id: SC-001
    name: Customer Security Request Tracker
    root: "06"
    type: tracker
    criticality: high
    owner_role: sales_or_security_lead
    review_cadence_days: 30
    depends_on: [CO-001]
    evidence_types: [completed_cais_sig_vsq]
    framework_mappings: [EnterpriseProcurement-Standard]
    requirement:
      default: optional
      overrides:
        - when: {triggers_any: [enterprise_sales, security_questionnaires]}
          level: required
    why: Reuses answers across questionnaires; shortens deal cycles.

  - id: SC-002
    name: Contract Obligations Register
    root: "06"
    type: register
    criticality: high
    owner_role: legal_or_founder
    review_cadence_days: 90
    depends_on: [CO-001]
    evidence_types: [signed_customer_order, sla_report]
    framework_mappings: [SOC2-CC9.1]
    requirement:
      default: recommended
      overrides:
        - when: {triggers_any: [enterprise_sales]}
          level: required
    why: Tracks commitments made to customers.

  - id: SC-003
    name: Evidence Index
    root: "06"
    type: index
    criticality: high
    owner_role: cto_or_security_lead
    review_cadence_days: 30
    depends_on: [CO-001, ES-001]
    evidence_types: [screenshot_log, automated_api_check]
    framework_mappings: [SOC2-CC4.2, ISO27001-A.18.1]
    requirement:
      default: optional
      overrides:
        - when: {triggers_any: [soc2_iso, audit, enterprise_sales]}
          level: required
    why: Maps evidence to claims and controls; readiness, not certification.

  # --- 08 / 09 ---
  - id: OP-001
    name: SOP Template
    root: "08"
    type: template
    criticality: medium
    owner_role: COO_or_founder
    review_cadence_days: 180
    depends_on: [CO-002]
    evidence_types: [published_sop_doc]
    framework_mappings: [ISO9001-4.4]
    requirement:
      default: recommended
    why: Standard shape for repeatable processes.

  - id: OP-002
    name: Business Continuity Plan (draft template)
    root: "08"
    type: template
    criticality: high
    owner_role: COO_or_founder
    review_cadence_days: 180
    depends_on: [GV-002]
    evidence_types: [annual_tabletop_exercise_notes]
    framework_mappings: [SOC2-A1.2, ISO27001-A.17.1]
    requirement:
      default: optional
      overrides:
        - when: {triggers_any: [soc2_iso, enterprise_sales]}
          level: recommended
    why: Enterprise buyers ask for it; content must be founder-supplied.

  - id: LG-001
    name: Policy Gap Report
    root: "09"
    type: report
    criticality: high
    owner_role: system
    review_cadence_days: 7
    depends_on: [CO-005, SC-003]
    evidence_types: [generated_readiness_score]
    framework_mappings: [SOC2-CC4.1, GovernanceReadiness]
    requirement:
      default: recommended
      overrides:
        - when: {triggers_any: [soc2_iso, security_questionnaires, enterprise_sales]}
          level: required
    why: Internal readiness view of missing or stale policies and evidence.
    note: Reports gaps only. Never asserts compliance or legal status.

generation_policy:
  regulated_or_legal_text: ai_assisted_draft_with_provenance_and_required_human_approver
  missing_facts: leave_marked_placeholder_do_not_invent
  every_artifact_records: [rule_id, applicability_reason, generated_at, approver]
